<script>
// ============ THAY THẾ window.storage BẰNG FIREBASE + localStorage ============
// - shared = true  -> lưu ở Firebase Firestore, MỌI quản lý cùng thấy (dữ liệu kho, nhân viên...)
// - shared = false -> lưu ở localStorage, CHỈ RIÊNG điện thoại đó (VD: nhớ kho đã chọn lần trước)
// Giữ nguyên interface .get()/.set() giống hệt window.storage của Claude, nên KHÔNG cần sửa code app bên dưới.

const db = firebase.firestore();
const COLLECTION = "appwh_storage";

window.storage = {
  get: async (key, shared) => {
    if (!shared) {
      const v = localStorage.getItem(key);
      if (v === null) throw new Error("not found: " + key);
      return { key, value: v, shared };
    }
    const doc = await db.collection(COLLECTION).doc(key).get();
    if (!doc.exists) throw new Error("not found: " + key);
    return { key, value: doc.data().value, shared };
  },
  set: async (key, value, shared) => {
    if (!shared) {
      localStorage.setItem(key, value);
      return { key, value, shared };
    }
    await db.collection(COLLECTION).doc(key).set({ value, updatedAt: Date.now() });
    return { key, value, shared };
  },
};

</script>

// ============ DATE UTILS ============
const pad = (n) => String(n).padStart(2, "0");
const toKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromKey = (k) => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const todayKey = () => toKey(new Date());
const addDays = (d, n) => { const nd = new Date(d); nd.setDate(nd.getDate() + n); return nd; };
const getMonday = (d) => { const nd = new Date(d); const day = nd.getDay(); const diff = day === 0 ? -6 : 1 - day; nd.setDate(nd.getDate() + diff); nd.setHours(0, 0, 0, 0); return nd; };
const fmtVN = (d) => `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;

function inCurrentWeek(dateStr, ref) {
  const monday = getMonday(ref);
  const saturday = addDays(monday, 5);
  const d = fromKey(dateStr);
  return d >= monday && d <= saturday;
}
function inCurrentMonth(dateStr, ref) {
  const d = fromKey(dateStr);
  return d.getFullYear() === ref.getFullYear() && d.getMonth() === ref.getMonth();
}
function inCurrentYear(dateStr, ref) {
  return fromKey(dateStr).getFullYear() === ref.getFullYear();
}
function sumOT(records, employeeId, filterFn, ref) {
  return records
    .filter((r) => r.employeeId === employeeId && filterFn(r.date, ref))
    .reduce((s, r) => s + r.hours, 0);
}
function fmtHours(h) {
  const hh = Math.floor(h + 1e-9);
  const mm = Math.round((h - hh) * 60);
  return mm > 0 ? `${hh}h${String(mm).padStart(2, "0")}` : `${hh}h`;
}
// Tên dài (>13 ký tự, từ 3 từ trở lên) sẽ bỏ "họ" (từ đầu tiên) khi hiển thị trong danh sách để không bị tràn/cắt chữ
function displayName(fullName) {
  const words = fullName.trim().split(/\s+/);
  if (fullName.length > 13 && words.length >= 3) return words.slice(1).join(" ");
  return fullName;
}

// Tính tổng dự kiến (ngày/tuần/tháng/năm) NẾU thêm bản ghi mới này, trả về danh sách mốc bị vượt hạn mức
function checkOTLimits(otRecords, employeeId, date, hours, excludeRecordId, openingBalance = 0) {
  const ref = fromKey(date);
  const relevant = otRecords.filter((r) => r.employeeId === employeeId && r.id !== excludeRecordId);
  const dayTotal = relevant.filter((r) => r.date === date).reduce((s, r) => s + r.hours, 0) + hours;
  const weekTotal = sumOT(relevant, employeeId, inCurrentWeek, ref) + hours;
  const monthTotal = sumOT(relevant, employeeId, inCurrentMonth, ref) + hours;
  const yearTotal = sumOT(relevant, employeeId, inCurrentYear, ref) + hours + openingBalance;
  const violations = [];
  if (dayTotal > LIMITS.day) violations.push({ label: "Ngày", total: dayTotal, limit: LIMITS.day });
  if (weekTotal > LIMITS.week) violations.push({ label: "Tuần", total: weekTotal, limit: LIMITS.week });
  if (monthTotal > LIMITS.month) violations.push({ label: "Tháng", total: monthTotal, limit: LIMITS.month });
  if (yearTotal > LIMITS.year) violations.push({ label: "Năm", total: yearTotal, limit: LIMITS.year });
  return violations;
}

const THRESHOLDS = {
  day: { yellow: null, red: 4 },     // giữ nguyên: trắng viền đỏ khi chạm 4h, không có mức vàng
  week: { yellow: 9, red: 12 },
  month: { yellow: 21, red: 32 },

};

function fmtCircleValue(v) {
  const r = Math.round(v * 10) / 10;
  return Number.isInteger(r) ? String(r) : r.toFixed(1);
}

function Circle({ field, value }) {
  const t = THRESHOLDS[field];
  let style;
  if (field === "day") {
    const danger = value >= t.red;
    style = { background: "#fff", border: danger ? "2px solid #D7263D" : "1.5px solid #999", color: "#333", boxShadow: danger ? "0 0 0 2px rgba(215,38,61,0.25)" : "none" };
  } else if (value >= t.red) {
    style = { background: "#D7263D", border: "none", color: "#fff", boxShadow: "none" };
  } else if (value >= t.yellow) {
    style = { background: "#F5B400", border: "none", color: "#fff", boxShadow: "none" };
  } else {
    style = { background: "#fff", border: "1.5px solid #ccc", color: "#333", boxShadow: "none" };
  }
  const isYear = field === "year"; // số năm có thể dài (vd 140.5) -> dùng viên thuốc tự giãn thay vì hình tròn cố định
  return (
    <div
      style={{
        minWidth: 34, height: 34, borderRadius: isYear ? 17 : "50%",
        padding: isYear ? "0 9px" : 0,
        display: "flex", alignItems: "center", justifyContent: "center",
        fontSize: isYear ? 12.5 : 12, fontWeight: 700, flexShrink: 0, whiteSpace: "nowrap", ...style,
      }}
      title={`${fmtHours(value)} (${field})`}
    >
      {fmtCircleValue(value)}
    </div>
  );
}

function AppWH() {
  const [data, setData] = useState(null);
  const [screen, setScreen] = useState("loading"); // loading | khoSelect | main
  const [currentKho, setCurrentKho] = useState(null);

  useEffect(() => {
    (async () => {
      // 1) Dữ liệu kho — DÙNG CHUNG cho mọi quản lý (shared: true)
      let loadedData;
      try {
        const res = await window.storage.get(STORAGE_KEY, true);
        loadedData = JSON.parse(res.value);
      } catch (e) {
        loadedData = buildSeed();
        try { await window.storage.set(STORAGE_KEY, JSON.stringify(loadedData), true); } catch (_) {}
      }
      setData(loadedData);

      // 2) Kho đã chọn lần trước — RIÊNG cho từng người/thiết bị (shared: false)
      let lastKhoId = null;
      try {
        const res2 = await window.storage.get(LAST_KHO_KEY, false);
        lastKhoId = JSON.parse(res2.value)?.khoId || null;
      } catch (e) { /* chưa từng chọn, bỏ qua */ }

      const found = WAREHOUSES.find((w) => w.id === lastKhoId);
      if (found) { setCurrentKho(found); setScreen("main"); }
      else setScreen("khoSelect");
    })();
  }, []);

  const persist = async (next) => {
    setData(next);
    try { await window.storage.set(STORAGE_KEY, JSON.stringify(next), true); } catch (_) {}
  };

  const pickKho = async (kho) => {
    setCurrentKho(kho);
    setScreen("main");
    try { await window.storage.set(LAST_KHO_KEY, JSON.stringify({ khoId: kho.id }), false); } catch (_) {}
  };

  if (!data || screen === "loading") {
    return <div style={{ display: "flex", alignItems: "center", justifyContent: "center", height: "100vh", fontFamily: "Verdana, sans-serif", color: "#666" }}>Đang tải APP WH…</div>;
  }

  if (screen === "khoSelect") {
    return <KhoSelectScreen employees={data.employees} onPick={pickKho} />;
  }
  return (
    <MainScreen
      data={data} persist={persist} currentKho={currentKho}
      onSwitchKho={() => setScreen("khoSelect")}
    />
  );
}

  }, [data.employees, currentKho]);
  const khoEmployeeIds = useMemo(() => new Set(khoEmployees.map((e) => e.id)), [khoEmployees]);

  // ---- Tăng ca: thêm / sửa / xoá ----
  const addOT = (employeeId, date, hours) => {
    persist({ ...data, ot: [...data.ot, { id: "ot" + Date.now(), employeeId, date, hours }] });
    setOtModal(null);
  };
  const updateOT = (id, patch) => {
    persist({ ...data, ot: data.ot.map((r) => r.id === id ? { ...r, ...patch } : r) });
    setOtModal(null);
  };
  const deleteOT = (id) => {
    askConfirm("Xoá bản ghi tăng ca này?", () => {
      persist({ ...data, ot: data.ot.filter((r) => r.id !== id) });
      setOtModal(null);
    });
  };
  const addBulkOT = (employeeIds, date, hours) => {
    const newRecords = employeeIds.map((employeeId, i) => ({
      id: `ot${Date.now()}_${i}`, employeeId, date, hours,
    }));
    persist({ ...data, ot: [...data.ot, ...newRecords] });
    setBulkOtOpen(false);
  };

  // ---- Đăng ký nhanh (tab Đăng ký): gửi lại cùng người/cùng ngày/cùng loại sẽ tự cập nhật ----
  const quickSubmitOT = (employeeId, date, hours, note) => {
    const existing = data.ot.find((r) => r.employeeId === employeeId && r.date === date);
    if (existing) {
      persist({ ...data, ot: data.ot.map((r) => r.id === existing.id ? { ...r, hours, note } : r) });
    } else {
      persist({ ...data, ot: [...data.ot, { id: "ot" + Date.now(), employeeId, date, hours, note }] });
    }
  };
  const quickSubmitLeave = (employeeId, date, type, extra) => {
    const existing = data.leave.find((l) => l.employeeId === employeeId && l.date === date && l.type === type);
    if (existing) {
      persist({ ...data, leave: data.leave.map((l) => l.id === existing.id ? { ...l, ...extra } : l) });
    } else {
      persist({ ...data, leave: [...data.leave, { id: "lv" + Date.now(), employeeId, date, type, ...extra }] });
    }
  };

  // ---- Nghỉ phép ----
  const addLeave = (employeeId, date, type, extra = {}) => {
    persist({ ...data, leave: [...data.leave, { id: "lv" + Date.now(), employeeId, date, type, ...extra }] });
    setLeaveModal(null);
  };
  const deleteLeave = (id) => {
    askConfirm("Xoá mục nghỉ phép này?", () => {
      persist({ ...data, leave: data.leave.filter((l) => l.id !== id) });
    });
  };

  // ---- Sự kiện / ghi chú ----
  const addEvent = (ev) => {
    persist({ ...data, events: [...data.events, { id: "ev" + Date.now(), warehouseId: currentKho.id, ...ev }] });
    setNoteModal(false);
  };
  const deleteEvent = (id) => {
    askConfirm("Xoá sự kiện này?", () => {
      persist({ ...data, events: data.events.filter((e) => e.id !== id) });
    });
  };

  // ---- Ca làm việc ----
  const setShift = (employeeId, shift, position) => {
    persist({ ...data, employees: data.employees.map((e) => e.id === employeeId ? { ...e, shift, position } : e) });
    setShiftModal(null);
  };

  // ---- Quản lý nhân sự: thêm / sửa / xoá người ----
  const saveEmployee = (form, editingId) => {
    if (editingId) {
      persist({ ...data, employees: data.employees.map((e) => e.id === editingId ? { ...e, ...form } : e) });
    } else {
      const id = nextEmployeeId(data.employees);
      persist({ ...data, employees: [...data.employees, { id, ...form }] });
    }
    setEmpForm(null);
  };
  const deleteEmployee = (id) => {
    askConfirm("Xoá nhân viên này? Toàn bộ lịch sử tăng ca / nghỉ phép của người này cũng sẽ bị xoá.", () => {
      persist({
        ...data,
        employees: data.employees.filter((e) => e.id !== id),
        ot: data.ot.filter((r) => r.employeeId !== id),
        leave: data.leave.filter((l) => l.employeeId !== id),
      });
    });
  };

  const onTouchStart = (e) => { touchStartX.current = e.touches[0].clientX; };
  const onTouchEnd = (e, id) => {
    const dx = e.changedTouches[0].clientX - touchStartX.current;
    if (dx < -40) setOpenRowId(id);
    else if (dx > 40) setOpenRowId(null);
  };

  return (
    <div style={{ fontFamily: "Verdana, Geneva, sans-serif", background: "#F4F7F8", height: "100vh", display: "flex", flexDirection: "column", maxWidth: 480, margin: "0 auto", position: "relative" }}>
      <div style={{ background: BRAND, color: "#fff", padding: "14px 18px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <button onClick={onSwitchKho} style={{ background: "none", border: "none", color: "#fff", textAlign: "left", padding: 0 }}>
          <div style={{ fontSize: 11, opacity: 0.85, display: "flex", alignItems: "center", gap: 3 }}>APP WH <ChevronDown size={12} /></div>
          <div style={{ fontSize: 17, fontWeight: 800 }}>{currentKho.name}</div>
        </button>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <div style={{ fontSize: 11, background: "rgba(255,255,255,0.18)", padding: "4px 10px", borderRadius: 20 }}>{fmtVN(today)}</div>
          <button onClick={() => setManageOpen(true)} title="Quản lý nhân sự" style={{ background: "rgba(255,255,255,0.18)", border: "none", borderRadius: "50%", width: 30, height: 30, display: "flex", alignItems: "center", justifyContent: "center" }}>
            <Settings size={16} color="#fff" />
          </button>
        </div>
      </div>

      <div style={{ flex: 1, overflowY: "auto", paddingBottom: 70 }}>
        {tab === "employees" && (
          <EmployeeList
            employees={khoEmployees} ot={data.ot} today={today} openRowId={openRowId} setOpenRowId={setOpenRowId}
            onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}
            onTangCa={(id) => { setOpenRowId(null); setOtModal({ employeeId: id }); }}
            onNghiPhep={(id) => { setOpenRowId(null); setLeaveModal({ employeeId: id }); }}
            onShiftTap={(id) => setShiftModal({ employeeId: id })}
            onNameTap={(id) => setOtHistoryId(id)}
            onBulkOT={() => setBulkOtOpen(true)}
          />
        )}
        {tab === "calendar" && (
          <CalendarTab
            employees={khoEmployees} leave={data.leave.filter((l) => khoEmployeeIds.has(l.employeeId))}
            events={data.events.filter((e) => e.warehouseId === currentKho.id)}
            ot={data.ot.filter((r) => khoEmployeeIds.has(r.employeeId))}
            monthCursor={monthCursor} setMonthCursor={setMonthCursor}
            today={today} onDayTap={(k) => setDayDetail(k)}
          />
        )}
        {tab === "dangky" && (
          <QuickEntryTab
            employees={khoEmployees} otRecords={data.ot} leaveRecords={data.leave}
            onSubmitOT={quickSubmitOT} onSubmitLeave={quickSubmitLeave}
          />
        )}
      </div>

      {tab === "calendar" && (
        <button onClick={() => setNoteModal(true)} style={{ position: "absolute", right: 18, bottom: 82, width: 52, height: 52, borderRadius: "50%", background: BRAND, border: "none", color: "#fff", boxShadow: "0 4px 12px rgba(0,0,0,0.25)", display: "flex", alignItems: "center", justifyContent: "center" }}>
          <Plus size={26} />
        </button>
      )}

      <div style={{ position: "absolute", bottom: 0, left: 0, right: 0, display: "flex", borderTop: "1px solid #e2e2e2", background: "#fff" }}>
        <TabBtn active={tab === "employees"} onClick={() => setTab("employees")} icon={<Users size={20} />} label="Nhân viên" />
        <TabBtn active={tab === "calendar"} onClick={() => setTab("calendar")} icon={<CalendarDays size={20} />} label="Lịch" />
        <TabBtn active={tab === "dangky"} onClick={() => setTab("dangky")} icon={<PenLine size={20} />} label="Đăng ký" />
      </div>

      {otModal && (
        <OTModal
          employees={khoEmployees} otRecords={data.ot} defaultId={otModal.employeeId} record={otModal.record}
          onClose={() => setOtModal(null)} onSave={addOT} onUpdate={updateOT} onDelete={deleteOT}
        />
      )}
      {bulkOtOpen && <BulkOTModal employees={khoEmployees} otRecords={data.ot} onClose={() => setBulkOtOpen(false)} onSave={addBulkOT} />}
      {leaveModal && <LeaveModal employees={khoEmployees} defaultId={leaveModal.employeeId} onClose={() => setLeaveModal(null)} onSave={addLeave} />}
      {noteModal && <NoteModal onClose={() => setNoteModal(false)} onSave={addEvent} />}
      {shiftModal && <ShiftModal employee={khoEmployees.find((e) => e.id === shiftModal.employeeId)} onClose={() => setShiftModal(null)} onSave={setShift} />}
      {dayDetail && (
        <DayDetailModal
          dateKey={dayDetail} employees={khoEmployees}
          leave={data.leave.filter((l) => khoEmployeeIds.has(l.employeeId))}
          events={data.events.filter((e) => e.warehouseId === currentKho.id)}
          ot={data.ot.filter((r) => khoEmployeeIds.has(r.employeeId))}
          onClose={() => setDayDetail(null)} onDeleteLeave={deleteLeave} onDeleteEvent={deleteEvent} onDeleteOT={deleteOT}
        />
      )}
      {otHistoryId && (
        <OTHistoryModal
          employee={khoEmployees.find((e) => e.id === otHistoryId)}
          records={data.ot.filter((r) => r.employeeId === otHistoryId).sort((a, b) => b.date.localeCompare(a.date))}
          onClose={() => setOtHistoryId(null)}
          onEdit={(record) => { setOtHistoryId(null); setOtModal({ employeeId: record.employeeId, record }); }}
          onDelete={deleteOT}
          onAddNew={() => { setOtHistoryId(null); setOtModal({ employeeId: otHistoryId }); }}
        />
      )}
      {manageOpen && (
        <EmployeeManageModal
          allEmployees={data.employees} defaultKhoId={currentKho.id}
          onClose={() => setManageOpen(false)}
          onAddNew={(khoId) => setEmpForm({ mode: "add", khoId })}
          onEdit={(emp) => setEmpForm({ mode: "edit", employee: emp })}
          onDelete={deleteEmployee}
        />
      )}
      {empForm && (
        <EmployeeFormModal
          mode={empForm.mode} employee={empForm.employee} defaultKhoId={empForm.khoId || empForm.employee?.warehouseId}
          onClose={() => setEmpForm(null)}
          onSave={(form) => saveEmployee(form, empForm.employee?.id)}
        />
      )}
      {confirm && (
        <ConfirmModal
          message={confirm.message}
          onCancel={() => setConfirm(null)}
          onConfirm={() => { confirm.onYes(); setConfirm(null); }}
        />
      )}
    </div>
  );
}

function TabBtn({ active, onClick, icon, label }) {
  return (
    <button onClick={onClick} style={{ flex: 1, padding: "10px 0 8px", background: "none", border: "none", display: "flex", flexDirection: "column", alignItems: "center", gap: 3, color: active ? BRAND : "#8a8a8a" }}>
      {icon}
      <span style={{ fontSize: 11, fontWeight: 700 }}>{label}</span>
    </button>
  );
}

// ============ EMPLOYEE LIST ============
function EmployeeList({ employees, ot, today, openRowId, setOpenRowId, onTouchStart, onTouchEnd, onTangCa, onNghiPhep, onShiftTap, onNameTap, onBulkOT }) {
  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "12px 16px 6px", gap: 10 }}>
        <div style={{ fontSize: 11, color: "#888", lineHeight: 1.5 }}>Vuốt sang trái để chọn Tăng ca / Nghỉ phép · Bấm tên để xem/sửa giờ tăng ca · Bấm ca làm để đổi ca</div>
        <button onClick={onBulkOT} style={{ flexShrink: 0, background: BRAND, color: "#fff", border: "none", borderRadius: 8, padding: "7px 12px", fontSize: 12.5, fontWeight: 800, whiteSpace: "nowrap" }}>OT+</button>
      </div>
      {employees.map((emp) => {
        const day = sumOT(ot, emp.id, (d, ref) => d === toKey(ref), today);
        const week = sumOT(ot, emp.id, inCurrentWeek, today);
        const month = sumOT(ot, emp.id, inCurrentMonth, today);
        const year = sumOT(ot, emp.id, inCurrentYear, today) + (emp.otOpeningBalance || 0);
        const open = openRowId === emp.id;
        return (
          <div key={emp.id} style={{ position: "relative", overflow: "hidden", borderBottom: "1px solid #ececec" }}>
            <div style={{ position: "absolute", right: 0, top: 0, bottom: 0, width: 160, display: "flex" }}>
              <button onClick={() => onTangCa(emp.id)} style={{ flex: 1, background: BRAND, color: "#fff", border: "none", fontSize: 12, fontWeight: 700 }}>Tăng ca</button>
              <button onClick={() => onNghiPhep(emp.id)} style={{ flex: 1, background: "#D7263D", color: "#fff", border: "none", fontSize: 12, fontWeight: 700 }}>Nghỉ phép</button>
            </div>
            <div
              onTouchStart={onTouchStart}
              onTouchEnd={(e) => onTouchEnd(e, emp.id)}
              style={{
                background: "#fff", padding: "12px 14px", display: "flex", alignItems: "center", justifyContent: "space-between",
                transform: open ? "translateX(-160px)" : "translateX(0)", transition: "transform 0.2s ease",
              }}
            >
              <div style={{ display: "flex", flexDirection: "column", gap: 4, minWidth: 0 }} onClick={() => onNameTap(emp.id)}>
                <div style={{ fontSize: 15, fontWeight: 600, color: "#222", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{displayName(emp.name)}</div>
                <button onClick={(e) => { e.stopPropagation(); onShiftTap(emp.id); }} style={{
                  alignSelf: "flex-start", border: "none", borderRadius: 8, padding: "2px 8px", fontSize: 11, fontWeight: 700,
                  background: (emp.shift === "Ca 1" || emp.shift === "Ca 2") ? "#FFF3C4" : "#EEF2F3",
                  color: (emp.shift === "Ca 1" || emp.shift === "Ca 2") ? "#8A6D00" : "#555",
                }}>
                  {emp.shift || "Chưa xếp ca"}{emp.position ? ` - ${emp.position}` : ""}
                </button>
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <Circle field="day" value={day} />
                <Circle field="week" value={week} />
                <Circle field="month" value={month} />
                <Circle field="year" value={year} />
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ============ SHIFT & VỊ TRÍ MODAL ============
function ShiftModal({ employee, onClose, onSave }) {
  const [shift, setShiftVal] = useState(employee?.shift);
  const [position, setPositionVal] = useState(employee?.position);
  if (!employee) return null;
  return (
    <Modal title={`Xếp ca & vị trí · ${employee.name}`} onClose={onClose}>
      <Field label="Ca làm việc">
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
          {SHIFTS.map((s) => (
            <button key={s} onClick={() => setShiftVal(s)} style={{
              padding: "14px 0", borderRadius: 10, fontWeight: 700, fontSize: 15,
              border: shift === s ? `2px solid ${BRAND}` : "1px solid #ddd",
              background: shift === s ? "#E6F6FA" : "#fff", color: shift === s ? BRAND : "#333",
            }}>{s}</button>
          ))}
        </div>
      </Field>
      <Field label="Vị trí làm việc">
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10 }}>
          {POSITIONS.map((p) => (
            <button key={p} onClick={() => setPositionVal(p)} style={{
              padding: "14px 0", borderRadius: 10, fontWeight: 700, fontSize: 14,
              border: position === p ? `2px solid ${BRAND}` : "1px solid #ddd",
              background: position === p ? "#E6F6FA" : "#fff", color: position === p ? BRAND : "#333",
            }}>{p}</button>
          ))}
        </div>
      </Field>
      <button style={primaryBtn} onClick={() => onSave(employee.id, shift, position)}>Lưu</button>
    </Modal>
  );
}

// ============ OT HÀNG LOẠT (nhiều người, cùng ngày, cùng giờ) ============
function BulkOTModal({ employees, otRecords, onClose, onSave }) {
  const [selected, setSelected] = useState(new Set());
  const [date, setDate] = useState(todayKey());
  const [hours, setHours] = useState(null);

  const toggle = (id) => {
    const next = new Set(selected);
    next.has(id) ? next.delete(id) : next.add(id);
    setSelected(next);
  };
  const allChecked = employees.length > 0 && selected.size === employees.length;

  const perPersonViolations = useMemo(() => {
    if (!hours) return [];
    return [...selected]
      .map((id) => ({ id, name: employees.find((e) => e.id === id)?.name, v: checkOTLimits(otRecords, id, date, hours, null, employees.find((e) => e.id === id)?.otOpeningBalance || 0) }))
      .filter((x) => x.v.length > 0);
  }, [selected, date, hours, otRecords, employees]);

  return (
    <Modal title="Đăng ký tăng ca hàng loạt" onClose={onClose}>
      <Field label={`Chọn nhân viên (${selected.size} đã chọn)`}>
        <button
          onClick={() => setSelected(allChecked ? new Set() : new Set(employees.map((e) => e.id)))}
          style={{ background: "none", border: "none", color: BRAND, fontSize: 12.5, fontWeight: 700, padding: "0 0 8px" }}
        >
          {allChecked ? "Bỏ chọn tất cả" : "Chọn tất cả"}
        </button>
        <div style={{ maxHeight: 220, overflowY: "auto", border: "1px solid #eee", borderRadius: 10 }}>
          {employees.map((e) => (
            <label key={e.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "9px 12px", borderBottom: "1px solid #f2f2f2", fontSize: 14 }}>
              <input type="checkbox" checked={selected.has(e.id)} onChange={() => toggle(e.id)} style={{ width: 17, height: 17 }} />
              <span style={{ flex: 1 }}>{e.name}</span>
              <span style={{ fontSize: 11, color: "#999" }}>{e.shift}</span>
            </label>
          ))}
        </div>
      </Field>
      <Field label="Ngày (áp dụng cho tất cả người đã chọn)">
        <input type="date" style={inputStyle} value={date} onChange={(e) => setDate(e.target.value)} />
      </Field>
      <Field label="Số giờ tăng ca (áp dụng chung, tối đa 4h/ngày)">
        <HourMinutePicker hourOptions={[1, 2, 3, 4]} value={hours} onChange={setHours} />
      </Field>
      {perPersonViolations.length > 0 && (
        <div style={{ background: "#FDECEC", border: "1px solid #F3B7BE", borderRadius: 10, padding: "10px 12px", marginBottom: 14 }}>
          <div style={{ fontSize: 13, fontWeight: 800, color: "#D7263D", marginBottom: 4 }}>⚠ {perPersonViolations.length} người sẽ vượt hạn mức</div>
          {perPersonViolations.map((x) => (
            <div key={x.id} style={{ fontSize: 12.5, color: "#B01E33" }}>
              {x.name}: {x.v.map((v) => `${v.label} ${fmtHours(v.total)} (>${fmtHours(v.limit)})`).join(", ")}
            </div>
          ))}
        </div>
      )}
      <button disabled={!hours || selected.size === 0} style={{ ...primaryBtn, opacity: (!hours || selected.size === 0) ? 0.5 : 1, background: perPersonViolations.length ? "#D7263D" : BRAND }}
        onClick={() => hours && selected.size > 0 && onSave([...selected], date, hours)}>
        {perPersonViolations.length ? `Vẫn lưu cho ${selected.size} người (có vượt hạn mức)` : `Lưu cho ${selected.size} người`}
      </button>
    </Modal>
  );
}

// ============ CHỌN GIỜ:PHÚT (kéo để chọn — dùng select để có bánh xe gốc trên iPhone) ============
function HourMinutePicker({ hourOptions, value, onChange }) {
  const h = value == null ? "" : Math.floor(value + 1e-9);
  const m = value == null ? 0 : Math.round((value - Math.floor(value + 1e-9)) * 60);
  return (
    <div style={{ display: "flex", gap: 8 }}>
      <select style={{ ...inputStyle, flex: 1 }} value={h} onChange={(e) => {
        const nh = e.target.value === "" ? null : Number(e.target.value);
        onChange(nh === null ? null : nh + m / 60);
      }}>
        <option value="">-- Giờ --</option>
        {hourOptions.map((o) => <option key={o} value={o}>{o} giờ</option>)}
      </select>
      <select style={{ ...inputStyle, flex: 1 }} value={m} disabled={h === ""} onChange={(e) => onChange((h === "" ? 0 : h) + Number(e.target.value) / 60)}>
        {[0, 15, 30, 45].map((o) => <option key={o} value={o}>{String(o).padStart(2, "0")} phút</option>)}
      </select>
    </div>
  );
}

// ============ OT MODAL ============
function OTModal({ employees, otRecords, defaultId, record, onClose, onSave, onUpdate, onDelete }) {
  const isEdit = !!record;
  const [empId, setEmpId] = useState(record?.employeeId || defaultId || employees[0]?.id);
  const [date, setDate] = useState(record?.date || todayKey());
  const [hours, setHours] = useState(record?.hours ?? null);
  const violations = useMemo(
    () => (hours ? checkOTLimits(otRecords, empId, date, hours, record?.id, employees.find((e) => e.id === empId)?.otOpeningBalance || 0) : []),
    [otRecords, empId, date, hours, record?.id, employees]
  );
  return (
    <Modal title={isEdit ? "Sửa giờ tăng ca" : "Đăng ký tăng ca"} onClose={onClose}>
      <Field label="Nhân viên">
        <select style={inputStyle} value={empId} onChange={(e) => setEmpId(e.target.value)} disabled={isEdit}>
          {employees.map((e) => <option key={e.id} value={e.id}>{e.name} — {e.shift}{e.position ? ` - ${e.position}` : ""}</option>)}
        </select>
      </Field>
      <Field label="Ngày"><input type="date" style={inputStyle} value={date} onChange={(e) => setDate(e.target.value)} /></Field>
      <Field label="Số giờ tăng ca (tối đa 4h/ngày)">
        <HourMinutePicker hourOptions={[1, 2, 3, 4]} value={hours} onChange={setHours} />
      </Field>
      <LimitWarning violations={violations} />
      <button disabled={!hours} style={{ ...primaryBtn, opacity: hours ? 1 : 0.5, background: violations.length ? "#D7263D" : BRAND }}
        onClick={() => hours && (isEdit ? onUpdate(record.id, { date, hours }) : onSave(empId, date, hours))}>
        {violations.length ? "Vẫn lưu (vượt hạn mức)" : (isEdit ? "Lưu thay đổi" : "Lưu")}
      </button>
      {isEdit && (
        <button onClick={() => onDelete(record.id)} style={{ width: "100%", background: "none", border: "none", color: "#D7263D", fontSize: 14, fontWeight: 700, padding: "12px 0 0" }}>
          Xoá bản ghi này
        </button>
      )}
    </Modal>
  );
}

// ============ LỊCH SỬ TĂNG CA CỦA 1 NGƯỜI ============
function OTHistoryModal({ employee, records, onClose, onEdit, onDelete, onAddNew }) {
  if (!employee) return null;
  return (
    <Modal title={`Lịch sử tăng ca · ${employee.name}`} onClose={onClose}>
      {records.length === 0 && <div style={{ color: "#888", fontSize: 14, marginBottom: 14 }}>Chưa có bản ghi tăng ca nào.</div>}
      {records.map((r) => (

function buildMonthGrid(cursor) {
  const year = cursor.getFullYear(), month = cursor.getMonth();
  const first = new Date(year, month, 1);
  const startOffset = (first.getDay() + 6) % 7;
  const gridStart = addDays(first, -startOffset);
  const cells = [];
  for (let i = 0; i < 42; i++) cells.push(addDays(gridStart, i));
  return cells;
}

function QuickEntryTab({ employees, otRecords, leaveRecords, onSubmitOT, onSubmitLeave }) {
  const [empId, setEmpId] = useState(employees[0]?.id || "");
  const [date, setDate] = useState(todayKey());
  const [loai, setLoai] = useState("tangca"); // tangca | nghi
  const [subType, setSubType] = useState("nghi"); // nghi | som | muon (chỉ dùng khi loai === "nghi")
  const [otHours, setOtHours] = useState(null);
  const [leaveHours, setLeaveHours] = useState(0.25);
  const [reason, setReason] = useState(LEAVE_REASONS[0]);
  const [note, setNote] = useState("");
  const [savedAt, setSavedAt] = useState(null);

  const employee = employees.find((e) => e.id === empId);

  const otViolations = useMemo(
    () => (loai === "tangca" && otHours ? checkOTLimits(otRecords, empId, date, otHours, null, employee?.otOpeningBalance || 0) : []),
    [loai, otHours, otRecords, empId, date, employee]
  );

  const canSubmit = loai === "tangca" ? !!otHours : (subType === "nghi" ? !!reason : !!leaveHours);

  const submit = () => {
    if (!empId || !canSubmit) return;
    if (loai === "tangca") {

  const subTypes = [
    { key: "nghi", label: "Nghỉ cả ngày" },

        </Field>

        <Field label="Loại">
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={() => { setLoai("tangca"); setSavedAt(null); }} style={{
              flex: 1, padding: "13px 0", borderRadius: 10, fontWeight: 800, fontSize: 14.5,
              border: loai === "tangca" ? `2px solid ${BRAND}` : "1px solid #ddd",
              background: loai === "tangca" ? BRAND : "#fff", color: loai === "tangca" ? "#fff" : "#444",
            }}>Tăng ca</button>
            <button onClick={() => { setLoai("nghi"); setSavedAt(null); }} style={{
              flex: 1, padding: "13px 0", borderRadius: 10, fontWeight: 800, fontSize: 14.5,
              border: loai === "nghi" ? "2px solid #D7263D" : "1px solid #ddd",
              background: loai === "nghi" ? "#D7263D" : "#fff", color: loai === "nghi" ? "#fff" : "#444",
            }}>Nghỉ phép</button>
          </div>
          {loai === "nghi" && (
            <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
              {subTypes.map((s) => (
                <button key={s.key} onClick={() => { setSubType(s.key); setSavedAt(null); }} style={{
                  flex: 1, padding: "8px 2px", borderRadius: 8, fontWeight: 700, fontSize: 11.5,
                  border: subType === s.key ? "2px solid #D7263D" : "1px solid #ddd",
                  background: subType === s.key ? "#FDECEC" : "#fafafa", color: subType === s.key ? "#D7263D" : "#666",
                }}>{s.label}</button>
              ))}
            </div>
          )}
        </Field>

        <Field label="Ngày">
          <input type="date" style={inputStyle} value={date} onChange={(e) => { setDate(e.target.value); setSavedAt(null); }} />
        </Field>

        {loai === "tangca" && (
          <Field label="Số giờ tăng ca (tối đa 4h/ngày)">
            <HourMinutePicker hourOptions={[1, 2, 3, 4]} value={otHours} onChange={(v) => { setOtHours(v); setSavedAt(null); }} />
          </Field>
        )}
        {loai === "tangca" && <LimitWarning violations={otViolations} />}

        {loai === "nghi" && subType === "nghi" && (
          <Field label="Lý do nghỉ">
            <select style={inputStyle} value={reason} onChange={(e) => { setReason(e.target.value); setSavedAt(null); }}>
              {LEAVE_REASONS.map((r) => <option key={r} value={r}>{r}</option>)}

          </Field>
        )}
        {loai === "nghi" && subType !== "nghi" && (
          <Field label={`Thời gian ${subType === "muon" ? "đi muộn" : "về sớm"}`}>
            <HourMinutePicker hourOptions={[0, 1, 2, 3, 4, 5, 6, 7]} value={leaveHours} onChange={(v) => { setLeaveHours(v); setSavedAt(null); }} />
          </Field>
        )}

        <Field label="Ghi chú (không bắt buộc)">
          <textarea style={{ ...inputStyle, minHeight: 60, resize: "vertical" }} placeholder="VD: tăng ca cắt gấp đơn XYZ" value={note} onChange={(e) => { setNote(e.target.value); setSavedAt(null); }} />
        </Field>

        <button disabled={!canSubmit} style={{ ...primaryBtn, opacity: canSubmit ? 1 : 0.5, background: (loai === "tangca" && otViolations.length) ? "#D7263D" : BRAND }} onClick={submit}>

        </div>
      </div>
    </div>
  );

// ============ CALENDAR TAB ============
function CalendarTab({ employees, leave, events, ot, monthCursor, setMonthCursor, today, onDayTap }) {
  const cells = useMemo(() => buildMonthGrid(monthCursor), [monthCursor]);
  const empName = (id) => employees.find((e) => e.id === id)?.name || "?";

  const dayInfo = (dateKey) => {
    const dayLeaves = leave.filter((l) => l.date === dateKey);
    const dayEvents = events.filter((e) => e.date === dateKey);
    const dayOT = ot.filter((r) => r.date === dateKey);
    const otCount = new Set(dayOT.map((r) => r.employeeId)).size;
    const nghi = dayLeaves.filter((l) => l.type === "nghi");
    const som = dayLeaves.filter((l) => l.type === "som");
    const muon = dayLeaves.filter((l) => l.type === "muon");
    return { nghi, som, muon, events: dayEvents, otCount, otList: dayOT, hasAny: dayLeaves.length + dayEvents.length + dayOT.length > 0 };
  };

  return (
    <div style={{ padding: "10px 10px 0" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "6px 6px 12px" }}>
        <button onClick={() => setMonthCursor(new Date(monthCursor.getFullYear(), monthCursor.getMonth() - 1, 1))} style={{ background: "none", border: "none" }}><ChevronLeft color={BRAND} /></button>
        <div style={{ fontWeight: 800, fontSize: 16 }}>Tháng {monthCursor.getMonth() + 1} {monthCursor.getFullYear()}</div>
        <button onClick={() => setMonthCursor(new Date(monthCursor.getFullYear(), monthCursor.getMonth() + 1, 1))} style={{ background: "none", border: "none" }}><ChevronRight color={BRAND} /></button>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", textAlign: "center", fontSize: 11, color: "#888", fontWeight: 700, marginBottom: 4 }}>
        {DOW_LABELS.map((l) => <div key={l}>{l}</div>)}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 3 }}>
        {cells.map((d, i) => {
          const inMonth = d.getMonth() === monthCursor.getMonth();
          const k = toKey(d);
          const isToday = k === toKey(today);
          const info = dayInfo(k);
          return (
            <div key={i} onClick={() => info.hasAny && onDayTap(k)}
              style={{
                minHeight: 62, background: "#fff", borderRadius: 8, padding: 4,
                opacity: inMonth ? 1 : 0.35, cursor: info.hasAny ? "pointer" : "default",
                border: isToday ? `1.5px solid ${BRAND}` : "1px solid #eee",
              }}>
              <div style={{
                width: 20, height: 20, borderRadius: "50%", fontSize: 11, fontWeight: 700,
                display: "flex", alignItems: "center", justifyContent: "center",
                background: isToday ? BRAND : "transparent", color: isToday ? "#fff" : "#333",
              }}>{d.getDate()}</div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 2, marginTop: 3 }}>
                {info.nghi.length === 1 && <DayChip color="#D7263D" label={empName(info.nghi[0].employeeId).split(" ").slice(-1)[0]} />}
                {info.nghi.length > 1 && <DayDot color="#D7263D" label={`${info.nghi.length}N`} />}
                {info.som.length === 1 && <DayDot color="#2FAE59" label="1S" sup={fmtHours(info.som[0].hours)} />}
                {info.som.length > 1 && <DayDot color="#2FAE59" label={`${info.som.length}S`} />}
                {info.muon.length === 1 && <DayDot color="#F5B400" label="1M" sup={fmtHours(info.muon[0].hours)} />}
                {info.muon.length > 1 && <DayDot color="#F5B400" label={`${info.muon.length}M`} />}
                {info.otCount > 0 && <DayChip color="#2F6FED" label={`${info.otCount}-OT`} />}
                {info.events.length > 0 && <div style={{ fontSize: 9, color: BRAND, fontWeight: 700 }}>● {info.events.length} sự kiện</div>}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function DayDot({ color, label, sup }) {
  return (
    <div style={{ position: "relative", display: "inline-block" }}>
      <div style={{ background: color, color: "#fff", fontSize: 9, fontWeight: 800, borderRadius: "50%", width: 20, height: 20, display: "flex", alignItems: "center", justifyContent: "center" }}>{label}</div>
      {sup != null && <div style={{ position: "absolute", bottom: -5, right: -8, background: "#fff", color, border: `1px solid ${color}`, borderRadius: 6, minWidth: 16, height: 12, padding: "0 2px", fontSize: 7, fontWeight: 800, display: "flex", alignItems: "center", justifyContent: "center", whiteSpace: "nowrap" }}>{sup}</div>}
    </div>
  );
}
function DayChip({ color, label }) {
  return <div style={{ background: color, color: "#fff", fontSize: 8.5, fontWeight: 700, borderRadius: 5, padding: "2px 4px", maxWidth: 46, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{label}</div>;

                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ fontSize: 12, fontWeight: 700, color: colorOf[l.type], background: colorOf[l.type] + "18", padding: "3px 8px", borderRadius: 12 }}>
                    {labelOf[l.type]}{l.hours ? ` · ${fmtHours(l.hours)}` : ""}
                  </span>
                  <button onClick={() => onDeleteLeave(l.id)} style={{ background: "none", border: "none", padding: 2 }}><Trash2 size={15} color="#bbb" /></button>
                </div>
              </div>
            );
          })}
        </div>
      )}
      {dayEvents.length > 0 && (
        <div style={{ marginTop: 12 }}>
          <div style={{ fontSize: 12, fontWeight: 700, color: "#888", marginBottom: 6 }}>SỰ KIỆN</div>
          {dayEvents.map((e) => (
            <div key={e.id} style={{ padding: "8px 10px", background: "#F4F7F8", borderRadius: 8, marginBottom: 6, display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
              <div>
                <div style={{ fontSize: 14, fontWeight: 700 }}>{e.title}</div>
                <div style={{ fontSize: 12, color: "#666", display: "flex", alignItems: "center", gap: 4, marginTop: 2 }}><Clock size={12} /> {e.time} {e.room && `· ${e.room}`}</div>
              </div>
              <button onClick={() => onDeleteEvent(e.id)} style={{ background: "none", border: "none", padding: 2 }}><Trash2 size={15} color="#bbb" /></button>
            </div>
          ))}
        </div>
      )}
    </Modal>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<AppWH />);

</script>
</body>
</html>
